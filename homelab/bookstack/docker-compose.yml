version: "3.8"

services:
  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    restart: unless-stopped
    ports:
      - "8086:80"
    environment:
      - PUID=1000
      - PGID=1000
      - APP_URL=https://docs.vaughnws.ca
      - APP_KEY= ## SET THIS YOURSELF
      - DB_CONNECTION=mysql
      - DB_HOST=bookstack_db
      - DB_PORT=3306
      - DB_DATABASE=bookstackapp
      - DB_USERNAME= ## SET THIS YOURSELF
      - DB_PASSWORD= ## SET THIS YOURSELF
    volumes:
      - ./bookstack_app_data:/config
    depends_on:
      - bookstack_db
    networks:
      - homelab-network

  bookstack_db:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: bookstack_db
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - MYSQL_ROOT_PASSWORD= ## SET THIS YOURSELF
      - MYSQL_DATABASE=bookstackapp
      - MYSQL_USER= ## SET THIS YOURSELF
      - MYSQL_PASSWORD= ## SET THIS YOURSELF
    volumes:
      - ./bookstack_db_data:/config
    networks:
      - homelab-network

networks:
  homelab-network:
    external: true
